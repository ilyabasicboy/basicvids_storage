services:
  basicvids_storage:
    image: ilyabasicboy/basicvids-storage:latest
    build: .
    container_name: basicvids_storage
    volumes:
      - ${DATA_PATH:-./data}:/basicvids_storage/data
    extra_hosts:
      - "${CUSTOM_HOST:-host.docker.internal}:host-gateway"
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
      REDIS_URL: redis://basicvids_redis:6379/2
    entrypoint: ["/basicvids_storage/entrypoint.sh"]
    expose:
      - "8000"
    networks:
      - basicvids

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: unless-stopped
    mem_limit: 768m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  basicvids_storage_worker:
    image: ilyabasicboy/basicvids-storage:latest
    build: .
    container_name: basicvids_storage_worker
    volumes:
      - ${DATA_PATH:-./data}:/basicvids_storage/data
    extra_hosts:
      - "${CUSTOM_HOST:-host.docker.internal}:host-gateway"
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
      REDIS_URL: redis://basicvids_redis:6379/2
    entrypoint: ["/basicvids_storage/worker-entrypoint.sh"]
    networks:
      - basicvids
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  basicvids:
    external: true
    name: basicvids
